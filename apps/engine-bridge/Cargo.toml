[package]
name = "engine-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "engine-bridge"
path = "src/main.rs"

[dependencies]
# The trading core, used as a library. Nothing in it is modified here.
solana-vntr-sniper = { path = "../../engine" }

axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
